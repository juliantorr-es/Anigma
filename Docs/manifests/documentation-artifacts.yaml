# ============================================================================
# VALIDATION SUMMARY
# =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

validation:
  all_artifacts_parse: true
  validation_commands:
    - "find Docs/schemas Docs/manifests Docs/architecture/maps -type f -size 0 | wc -l | grep -q '^0'$"
    - "python3 Scripts/validate_yaml_manifests.py"
    - "python3 Scripts/validate_verification_profiles.py"
    - "mmdc -i Docs/architecture/maps/logic-flows/*.mmd -o /tmp/mermaid-test/ 2>/dev/null || true"
    - "likec4 build Docs/diagrams/likec4 -o /tmp/likec4-test 2>/dev/null || true"
