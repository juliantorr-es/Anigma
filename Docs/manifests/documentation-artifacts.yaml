version: 1.0.0
last_updated: '2026-05-02'
schema: Docs/schemas/documentation-artifacts.schema.json
categories:
- category: Architecture Diagrams
  description: C4 and Mermaid diagrams defining system topology and flows
  primary_tool: likec4
  secondary_tools:
  - dot
  - mermaid-cli
  validation_profile: architecture-diagrams
  artifacts:
  - path: Docs/diagrams/likec4/anigma.c4
    type: likeC4_model
    status: active
    required: true
    description: Primary LikeC4 architecture model with System Context, Container, and Component views
    related_docs:
    - Docs/diagrams/likec4/README.md
    verification_commands:
    - command: likec4 build Docs/diagrams/likec4 -o /tmp/anigma-diagrams
      expected_exit: 0
      timeout: 60
  - path: Docs/diagrams/likec4/README.md
    type: likeC4_documentation
    status: active
    required: true
    description: LikeC4 tool usage, syntax guide, and migration from Structurizr
    related_docs:
    - Docs/diagrams/likec4/anigma.c4
    verification_commands: []
  - path: Docs/diagrams/structurizr/README.md
    type: structurizr_legacy
    status: legacy
    required: false
    description: Structurizr CLI documentation - marked as LEGACY/OPTIONAL
    note: Not deleted, but LikeC4 is now PRIMARY
- category: Architecture Maps
  description: Module and file role indexes with doctrine alignment
  primary_tool: python3
  secondary_tools:
  - yq
  - jq
  validation_profile: docs-artifacts
  artifacts:
  - path: Docs/architecture/maps/README.md
    type: index_documentation
    status: active
    required: true
    description: Architecture maps overview and usage guide
    related_docs:
    - Docs/architecture/maps/module-role-index.yaml
    - Docs/architecture/maps/file-role-index.yaml
    verification_commands: []
  - path: Docs/architecture/maps/module-role-index.yaml
    type: module_role_index
    status: active
    required: true
    description: Module-level role definitions with tier, dependencies, and doctrine
    schema: Docs/schemas/module-role-index.schema.json
    related_docs:
    - Docs/governance/TIER_GOVERNANCE.md
    verification_commands:
    - command: python3 -c "import yaml; yaml.safe_load(open('Docs/architecture/maps/module-role-index.yaml'))"
      expected_exit: 0
      timeout: 5
    - command: python3 -m json.tool Docs/schemas/module-role-index.schema.json > /dev/null
      expected_exit: 0
      timeout: 5
  - path: Docs/architecture/maps/file-role-index.yaml
    type: file_role_index
    status: active
    required: true
    description: File-level catalog with symbols, concepts, doctrine alignment
    schema: Docs/schemas/file-role-index.schema.json
    related_docs:
    - Docs/governance/TD_SOURCE_OF_TRUTH_DOCTRINE.md
    verification_commands:
    - command: python3 -c "import yaml; yaml.safe_load(open('Docs/architecture/maps/file-role-index.yaml'))"
      expected_exit: 0
      timeout: 5
    - command: python3 -m json.tool Docs/schemas/file-role-index.schema.json > /dev/null
      expected_exit: 0
      timeout: 5
  - path: Docs/architecture/maps/logic-flows/README.md
    type: logic_flows_index
    status: active
    required: true
    description: Index of Mermaid logic flow diagrams
    verification_commands: []
  - path: Docs/architecture/maps/logic-flows/media-materialization-flow.mmd
    type: mermaid_flow
    status: active
    required: true
    description: MediaCore surface materialization flow with zero-copy enforcement
    related_modules:
    - MediaCore
    verification_commands:
    - command: mmdc -i Docs/architecture/maps/logic-flows/media-materialization-flow.mmd -o /tmp/test.png 2>/dev/null || true
      expected_exit: 0
      timeout: 10
      optional_tool: mmdc
  - path: Docs/architecture/maps/logic-flows/td-bootstrap-flow.mmd
    type: mermaid_flow
    status: active
    required: true
    description: TD descriptor generation and bootstrap flow
    related_modules:
    - Governance Validators
    verification_commands:
    - command: mmdc -i Docs/architecture/maps/logic-flows/td-bootstrap-flow.mmd -o /tmp/test.png 2>/dev/null || true
      expected_exit: 0
      timeout: 10
      optional_tool: mmdc
  - path: Docs/architecture/maps/logic-flows/public-history-excision-flow.mmd
    type: mermaid_flow
    status: active
    required: true
    description: Git history filtering and public history preparation flow
    related_modules:
    - Governance Validators
    verification_commands:
    - command: mmdc -i Docs/architecture/maps/logic-flows/public-history-excision-flow.mmd -o /tmp/test.png 2>/dev/null ||
        true
      expected_exit: 0
      timeout: 10
      optional_tool: mmdc
  - path: Docs/architecture/maps/logic-flows/subprocess-pooling-planned-flow.mmd
    type: mermaid_flow
    status: active
    required: true
    description: anigmad subprocess pooling with worker lifecycle management
    related_modules:
    - AnigmaDaemon
    - SubprocessPooling
    related_tasks:
    - p0-004
    verification_commands:
    - command: mmdc -i Docs/architecture/maps/logic-flows/subprocess-pooling-planned-flow.mmd -o /tmp/test.png 2>/dev/null
        || true
      expected_exit: 0
      timeout: 10
      optional_tool: mmdc
