  validation_commands:
  - find Docs/schemas Docs/manifests Docs/architecture/maps Docs/timeline -type f -size 0 | wc -l | grep -q '^0$'
  - python3 scripts/validate_yaml_manifests.py
  - python3 scripts/validate_verification_profiles.py
  - python3 -m json.tool Docs/schemas/td-research.schema.json > /dev/null
  - python3 -m json.tool Docs/schemas/td-change-map.schema.json > /dev/null
