  # ============================================================================
  # MANIFESTS
  # =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - category: "YAML Manifests"
    description: "YAML configuration and policy manifests"
    primary_tool: "python3"
    validation_profile: "docs-artifacts"
    artifacts:
      - path: "Docs/manifests/verification-profiles.yaml"
        type: "verification_profiles"
        status: "active"
        required: true
        description: "Machine-readable verification profile definitions"
        version: "1.1.0"
        used_by:
          - "validate_verification_profiles.py"
          - "Agent workflows"
        verification_commands:
          - command: "python3 Scripts/validate_verification_profiles.py"
            expected_exit: 0
            timeout: 10
          - command: "python3 -c \"import yaml; yaml.safe_load(open('Docs/manifests/verification-profiles.yaml'))\""
            expected_exit: 0
            timeout: 5
      
      - path: "Docs/manifests/td-context-gc-policy.yaml"
        type: "gc_policy"
        status: "active"
        required: true
        description: "TD context garbage collection policy manifest"
        used_by:
          - "td_context_gc.py"
        verification_commands:
          - command: "python3 -c \"import yaml; yaml.safe_load(open('Docs/manifests/td-context-gc-policy.yaml'))\""
            expected_exit: 0
            timeout: 5
      
      - path: "Docs/manifests/documentation-artifacts.yaml"
        type: "artifacts_manifest"
        status: "active"
        required: true
        description: "This file - inventory of all documentation artifacts"
        self_referential: true
        verification_commands:
          - command: "python3 -c \"import yaml; yaml.safe_load(open('Docs/manifests/documentation-artifacts.yaml'))\""
            expected_exit: 0
