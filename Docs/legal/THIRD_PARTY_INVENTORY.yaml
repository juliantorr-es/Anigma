  # --- Vendored / C Libraries (Sidecar Candidates) ---
  - name: "PDFium"
    version: "unknown / needs_review"
    license: "Apache 2.0 / BSD 3-clause"
    used_as: "bundled_sidecar_non_app_store"
    distributed_in_app_store_build: false
    source_url: "unknown / needs_review"
    notice_required: true
    copyleft_risk: false
    app_store_status: "excluded_from_app_store_profile"
    notes: "Vendored binary in External/Vendor/PDFium/macos-arm64. Excluded from App Store builds until exact binary provenance and transitive notices are complete. PDFKit is the App Store fallback/default path. PDFSidecarExecutable must not be packaged into the App Store profile."
    replacement_path: "PDFKit"
    validation_gate: "Scripts/validate_app_store_dependency_boundaries.py"

  - name: "FFmpeg"
    version: "unknown / needs_review"
    license: "LGPL / GPL"
    used_as: "optional_external_tool"
    distributed_in_app_store_build: false
    source_url: "unknown / needs_review"
    notice_required: true
    copyleft_risk: true
    app_store_status: "high_risk"
    notes: "Conditionally linked via ENABLE_FFMPEG_LINKING. Extreme App Store risk if bundled directly due to LGPL/GPL dynamic linking conflicts."
    replacement_path: "AVFoundation, VideoToolbox, CoreMedia, CoreVideo, Metal"
    validation_gate: "Scripts/validate_app_store_dependency_boundaries.py"

