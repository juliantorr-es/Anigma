# ============================================================================
# VALIDATION RULES
# These rules are enforced by Scripts/validate_td_docs_sync.py
# ============================================================================

validation:
  rules:
    - id: "SRC-001"
      name: "Registry Coverage"
      description: "Every non-ad-hoc TD task must have a registry entry"
      severity: "ERROR"
      check: "SELECT id FROM td_tasks WHERE ad_hoc = false AND id NOT IN (SELECT id FROM registry_tasks)"
      
    - id: "SRC-002"
      name: "Schema Compliance"
      description: "Every registry task must validate against td-task.schema.json"
      severity: "ERROR"
      check: "json_schema_validation"
      
    - id: "SRC-003"
      name: "Proof Existence"
      description: "Every completed task must have a proof artifact in Docs/proofs/"
      severity: "ERROR"
      check: "file_exists(Docs/proofs/<task-id>.md) OR file_exists(proof.path)"
      
    - id: "SRC-004"
      name: "Proof Path Validity"
      description: "Every proof path in registry must point to existing file"
      severity: "ERROR"
      check: "all(proof_file in registry.proof for proof_file in registry.proofs if exists(proof_file))"
      
    - id: "SRC-005"
      name: "Source Docs Validity"
      description: "Every source_docs path in registry must point to existing file"
      severity: "ERROR"
      check: "all(doc in registry.source_docs for doc in registry.source_docs if exists(doc))"
      
    - id: "SRC-006"
      name: "Unique Task IDs"
      description: "Task IDs in registry must be unique"
      severity: "ERROR"
      check: "no duplicate ids in tasks list"
      
    - id: "SRC-007"
      name: "Children Registration"
      description: "Child task IDs should be listed in parent's children array"
      severity: "WARNING"
      check: "all(child in parent.children for child in tasks if child.parent == parent.id)"

