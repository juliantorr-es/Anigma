    Vendor concepts, not the whole toolchain.
    Use SwiftPM CLI / JSON as governed evidence input.
    Use SwiftSyntax for validator/tooling targets where justified.
    Keep libSwiftPM, swift-driver, llbuild, and compiler internals out of runtime targets unless a later proof says otherwise.
    
