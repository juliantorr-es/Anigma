# Alignment Diagnostic Rules for Anigma SwiftPM Workflow

# Target Role Classifications
# Maps target names or patterns to their expected role in the heterogeneous doctrine.
roles:
  targets:
    AnigmaPrimitives: portable_contract
    GovernanceCore: governance_runtime
    ContractsCore: portable_contract
    EvidenceContracts: portable_contract
    FoundationContracts: portable_contract
    GovernanceContracts: portable_contract
    IntelligenceContracts: portable_contract
    LayoutEngineContracts: portable_contract
    RendererBackendContracts: portable_contract
    MediaPipelineContracts: portable_contract
    HardwareAuthorityContracts: portable_contract
    AnigmaFoundation: substrate_runtime
    AnigmaGovernance: substrate_runtime
    AnigmaPipeline: governance_runtime
    AnigmaCore: substrate_runtime
    DatabaseCore: substrate_runtime
    StorageCore: substrate_runtime
    ExecutionCore: substrate_runtime
    InferenceCore: substrate_runtime
    HardwareAuthority: native_executor
    PDFNative: native_executor
    PDFLayoutExtract: native_executor
    LayoutEngineCapsule: native_executor
    PDFSidecarClient: sidecar_client
    PDFSidecarExecutable: sidecar_executable
    AnigmaMCPExecutable: sidecar_executable
    AnigmaDaemon: app_entrypoint
    HarmoniaV2CLI: cli_entrypoint
    BackendReadinessContractTests: test_readiness

# Native Executor Markers
# Targets that are considered native and must be isolated.
native_markers:
  targets:
    - HardwareAuthority
    - PDFNative
    - PDFLayoutExtract
    - LayoutEngineCapsule
    - PDFSidecarExecutable
    - MediaCore
  path_patterns:
    - "*/Native/*"
    - "*NativeShims*"
  linker_settings:
    - "-Xlinker"
    - "Accelerate"
    - "Metal"
    - "MPS"
    - "PDFium"

# Sidecar Executable Markers
sidecar_markers:
  product_names:
    - "*Sidecar*"
    - "anigma-mcp"
  target_names:
    - "*SidecarExecutable"
    - "AnigmaMCPExecutable"

# Contract Target Markers
contract_markers:
  target_names:
    - "*Contracts"
    - "*Contract"
    - "AnigmaPrimitives"
    - "HardwareAuthorityContracts"

# Receipt Requirements
# Maps roles/types to the receipt schema they must reference or emit.
receipt_requirements:
  native_executor: "executor_receipt"
  sidecar_executable: "sidecar_readiness_receipt"
  materialization_gate: "materialization_gate"
  chunk_storage: "chunk_storage_receipt"

# Forbidden Generic Readiness Reachability
# Targets in generic BackendReadiness should not depend on these.
forbidden_readiness_reachability:
  - PDFNative
  - HardwareAuthority
  - PDFSidecarExecutable

# Zero-Copy Claim Audit Patterns
# Regex patterns to scan for in Docs/ and Packages/
claim_audit_patterns:
  zero_copy:
    pattern: "zero-copy|zero copy|no-copy"
    severity: P1
    message: "Zero-copy claim without proven instrumentation."
  hardware_resident:
    pattern: "hardware-resident|hardware resident"
    severity: P1
    message: "Hardware-resident claim requires domain proof."
  copy_minimized:
    pattern: "copy-minimized|copy minimized"
    severity: informational
    message: "Standard optimized path claim."
  materialization_gate:
    pattern: "materialization gate"
    severity: informational
    message: "Enforcement point identified."

# Claim Scan Exclusions
# Path patterns where claim text scans should be excluded (meta-discussion, not actual claims)
claim_scan_exclusions:
  path_patterns:
    # Governance: doctrine files that define the rules
    - "Docs/governance/*.md"
    - "Docs/governance/*.yaml"
    # Research: analysis and criticism of zero-copy claims
    - "Docs/research/**/*"
    # Proofs: proof artifacts that document zero-copy proof mechanisms
    - "Docs/proofs/*.md"
    - "Docs/proofs/**/*.md"
    # Contract modules: define requirements/proof schemas, not implementation claims
    - "ContractsCore/**/*"
    - "CapsuleCore/**/*"
    # All ContractsCore sources (EvidenceContracts, FoundationContracts, etc.)
    - "anigma/Packages/ContractsCore/Sources/**/*"
    # All EvidenceContracts sources
    - "anigma/Packages/EvidenceContracts/**/*"
    # Hardware-resident doctrine (MediaGovernance defines MaterializationReason)
    - "anigma/Packages/ContractsCore/Sources/EvidenceContracts/Governance/MediaGovernance.swift"
    # CapsuleBuffer contract type descriptor
    - "anigma/Packages/CapsuleCore/Sources/CapsuleCore/CapsuleBuffer.swift"
    # Schemas: JSON/YAML schemas for receipts and contracts
    - "Docs/schemas/*.json"
    - "Docs/schemas/*.yaml"
    - "Docs/schemas/**/*"
    # TD registry and task tracking
    - "Docs/td/**/*"
    # Architecture maps and diagrams
    - "Docs/diagrams/**/*"
    - "Docs/architecture/**/*"
    # Mechanism-based: Shared memory (POSIX shm_open, mmap)
    - "anigma/Packages/AnigmaSidecar/SharedMemoryAuthority.swift"
    - "anigma/Packages/SubprocessPooling/Sources/MLWorker.swift"
    # Mechanism-based: Metal unified memory (.storageModeShared, MTLBuffer noCopy)
    - "anigma/Packages/TurboQuantKVCache/Sources/TurboQuantKVCache/GPUCacheTier.swift"
    - "anigma/Packages/SaturationInferenceCore/Sources/SaturationInferenceCore/CPUInferenceDispatcher.swift"
    # Mechanism-based: DSL Memory Bridge + TextProjection (mmap + MTLBuffer noCopy)
    - "anigma/Packages/SaturationKit/Sources/SaturationKit/DSLMemoryBridge.swift"
    - "anigma/Packages/SaturationKit/Sources/SaturationKit/TextProjection.swift"
    # Mechanism-based: Binary Atlas (mmap-based)
    - "anigma/Packages/SaturationKit/Sources/SaturationKit/BinaryAtlasStandard.swift"
  # Only scan these file types for claim patterns (production code)
  include_extensions:
    - ".swift"

# Claim Context Filters
# Filters to distinguish actual claims from meta-discussion
claim_context_filters:
  # Exclude lines containing these phrases (meta-discussion, not claims)
  exclude_phrases:
    - "do not claim zero-copy"
    - "zero-copy requires"
    - "zero-copy must"
    - "forbids zero-copy"
    - "cannot claim zero-copy"
    - "definition of zero-copy"
    - "zero-copy means"
    - "distinguishes zero-copy"
    - "copy-minimized vs zero-copy"
    - "overclaim"
    - "overclaims"
    - "Do not claim zero-copy"
    - "Do not claim"
    - "requires proof"
    - "must be proven"
    - "must have receipt"
    - "with receipt"
    - "receipt schema"
    - "proof mechanism"
    - "doctrine"
    - "Internal consistency###"
    # Future tense and conditional - not actual claims
    - "would need"
    - "would require"
    - "could be"
    - "should be"
    - "for true zero-copy"
    - "to achieve zero-copy"
    - "enabling"  
    - "allows"
    - "supports"
    - "capable of"
    - "can be"
    - "TODO"
    - "FIXME"
    - "XXX"
    # Technical descriptions of capabilities (not Anigma claims)
    - "mmap enables"
    - "enabling zero-copy access"
    # Documentation and notes
    - "Note:"
    - "NOTE:"
    - "Important:"
  # Only flag if the line contains positive claim language
  require_positive_claim: false
  positive_claim_phrases:
    - "is zero-copy"
    - "achieves zero-copy"
    - "provides zero-copy"
    - "true zero-copy"
    - "guaranteed zero-copy"
    - "zero-copy path"
    - "zero-copy flow"
    - "zero-copy execution"
    - "zero-copy transfer"
    - "zero-copy boundary"
    - "implements zero-copy"
    - "uses zero-copy"

# Deduplication Keys
# Ensure each unique (file, pattern) combination produces at most one diagnostic
deduplication:
  key: "file_pattern"  # One finding per file per pattern type

# Products with dedicated readiness evidence that should not be flagged as active P0
resolved_sidecar_products:
  product_names:
    - "PDFSidecarExecutable"
  reasons:
    - "PDFSidecarExecutable: Resolved by td-7c0153-01 with dedicated Scripts/test_pdf_sidecar_readiness.sh"

# Known Accepted Exceptions
# (diagnostic_id -> reason)
exceptions:
  - id: "ADM-0005"
    subject: "anigma-mcp"
    reason: "anigma-mcp: Governed sidecar with dedicated readiness lane - exception from P0 until explicit gap proven"

# Pre-existing Violations (Baseline)
pre_existing_violations:
  - "AnigmaFoundation -> HardwareAuthority"
  - "PDFLayoutExtract -> PDFNative"
