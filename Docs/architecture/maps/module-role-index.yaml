  # GOVERNANCE / TOOLING MODULES (Not Tiered - Support Infrastructure)
  # =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - module: "Governance Validators"
    tier: "Governance"
    responsibility: "Python-based architecture governance validators.Enforce tier boundaries, detect cycles, validate exported imports, and check YAML/JSON manifests."
    allowed_dependencies: []
    forbidden_dependencies: []
    key_files:
      - "Scripts/validate_tiers.py"
      - "Scripts/validate_no_cycles.py"
      - "Scripts/validate_exported_imports.py"
      - "Scripts/validate_yaml_manifests.py"
      - "Scripts/validate_verification_profiles.py"
      - "Scripts/validate_td_folder_system.py"
      - "Scripts/validate_td_docs_sync.py"
      - "Scripts/td_bootstrap_from_docs.py"
      - "Scripts/generate_td_descriptors.py"
      - "Scripts/td_context_gc.py"
    tests:
      - "Tests/GovernanceHarness/*"
    related_docs:
      - "Docs/governance/TIER_GOVERNANCE.md"
      - "Docs/governance/DEPENDENCY_GOVERNANCE.md"
      - "Docs/governance/VERIFICATION_PROFILES.md"
      - "Docs/governance/TD_CONTEXT_GARBAGE_COLLECTION.md"
      - "Docs/governance/TD_SOURCE_OF_TRUTH_DOCTRINE.md"
      - "Docs/diagrams/likec4/anigma.c4"
      - "Docs/architecture/maps/logic-flows/td-bootstrap-flow.mmd"
      - "Docs/architecture/maps/logic-flows/public-history-excision-flow.mmd"
    related_tasks:
      - "p1-td-source-of-truth-recovery"
    verification_profiles:
      - "governance"
      - "docs-td"
      - "docs-artifacts"
      - "architecture-diagrams"
    gc_policy: "retain_all"
    context_load_policy: "eager"
