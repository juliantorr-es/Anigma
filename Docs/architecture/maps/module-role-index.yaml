modules:

  # ============================================================================
  # TIER 1: CONSTITUTIONAL / CONTRACT LAYER
  # =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - module: "ContractsCore"
    tier: "Tier 1"
    responsibility: "Type-safe service contracts and portable interfaces. Defines what services exist and how they communicate without implementation."
    allowed_dependencies: []
    forbidden_dependencies: 
      - "Tier 2"  # Must not import any Tier 2 modules
      - "Tier 3"  # Must not import any Tier 3 modules
    key_files: []
    tests: []
    related_docs:
      - "Docs/ANIGMA_ARCHITECTURE_DIAGRAM.md"
      - "Docs/governance/TIER_GOVERNANCE.md"
    related_tasks: []
    verification_profiles:
      - "governance"
    gc_policy: "retain_all"
    context_load_policy: "eager"

  # ============================================================================
  # TIER 2: SUBSTRATE LAYER
  # =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - module: "MediaCore"
    tier: "Tier 2"
    responsibility: "Media processing substrate with zero-copy materialization enforcement. Authoritative source for image, PDF, video, audio processing with SurfaceAuthority gates and MaterializationGate protection."
    allowed_dependencies:
      - "ContractsCore"
      - "CoreUtilities"
      - "VectorOpsKit"
    forbidden_dependencies:
      - "AnigmaAppMac"  # Tier 3 must not depend on Tier 2
      - "AnigmaCLI"    # Tier 3 must not depend on Tier 2
      - "AnigmaDaemon" # Tier 3 must not depend on Tier 2
    key_files:
      - "Sources/MediaCore/Governance/SurfaceAuthority.swift"
      - "Sources/MediaCore/Governance/MaterializationGate.swift"
      - "Sources/MediaCore/Governance/MediaTypeAuthority.swift"
      - "Sources/MediaCore/Governance/MediaMemoryAuthority.swift"
      - "Sources/MediaCore/Governance/CaptureAuthority.swift"
      - "Sources/MediaCore/Governance/PacketStreamAuthority.swift"
      - "Sources/MediaCore/Governance/AudioBufferAuthority.swift"
      - "Sources/MediaCore/Governance/CaptureAcceptanceGate.swift"
      - "Sources/MediaCore/Substrate/SaturationSubstrate.swift"
      - "Sources/MediaCore/Orchestrator/MediaSubstrateOrchestrator.swift"
      - "Sources/MediaCore/Executors/*"
      - "Sources/MediaCore/Backends/*"
    tests:
      - "Tests/MediaCoreTests/*"
    related_docs:
      - "Docs/ANIGMA_ARCHITECTURE_DIAGRAM.md"
      - "Docs/diagrams/likec4/anigma.c4"
      - "Docs/architecture/maps/logic-flows/media-materialization-flow.mmd"
    related_tasks:
      - "p0-004"
    verification_profiles:
      - "governance"
      - "swift-runtime"
      - "swift-lint-format"
    gc_policy: "retain_all"
    context_load_policy: "eager"

  - module: "DocumentIRKit"
    tier: "Tier 2"
    responsibility: "Document model and intermediate representation for structured documents (PDF, OOXML). Portable types for document structure independent of rendering backend."
    allowed_dependencies:
      - "ContractsCore"
      - "CoreUtilities"
    forbidden_dependencies:
      - "RendererKit"  # Avoid circular dependency; use contracts
      - "MediaCore"   # Both Tier 2, but avoid tight coupling
    key_files:
      - "Sources/DocumentIRKit/*"
    tests:
