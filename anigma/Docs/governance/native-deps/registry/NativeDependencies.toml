# Status definitions
[status_definitions]
APPROVED = "Fully approved and in production use"
PENDING_IDR = "Intake Decision Record required"
PENDING_REVIEW = "Under security/legal/architecture review"
REJECTED = "Rejected - not suitable for inclusion"
DEPRECATED = "Approved but deprecated - removal planned"
UNDER_EVALUATION = "Initial evaluation in progress"

